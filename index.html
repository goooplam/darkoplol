<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkopLOL101 Server</title>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5898792457579415"
            crossorigin="anonymous"></script>

    <!-- Link to Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #2b2b2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            flex-direction: column;
            padding: 20px;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .server-address {
            font-size: 22px;
            margin: 20px 0;
            cursor: pointer;
            color: #4caf50;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #4caf50;
            transition: background-color 0.3s, transform 0.3s;
        }

        .server-address:hover {
            background-color: rgba(76, 175, 80, 0.3);
            transform: scale(1.1);
        }

        .links {
            margin-top: 30px;
        }

        .links a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            font-size: 20px;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
        }

        .links a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffcc70;
        }

        .icon {
            margin-right: 8px;
            vertical-align: middle;
        }

        .comments-section {
            margin-top: 30px;
            width: 100%;
            max-width: 600px;
        }

        .comment-box {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #4caf50;
            resize: none;
        }

        .comment-btn {
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .comment-btn:hover {
            background-color: #45a049;
        }

        .comment-list {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
        }

        .comment {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .image-section {
            margin-top: 30px;
        }

        .download-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .download-btn:hover {
            background-color: #1e88e5;
        }

        .fun-animation {
            margin-top: 50px;
            font-size: 24px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Join My Minecraft Server!</h1>
        <p class="server-address" onclick="copyText()">DarkopLOL101.aternos.me:38609</p>
        <div class="links">
            <a href="https://www.youtube.com/@DarkopLOL101" target="_blank" rel="noopener">
                <i class="fab fa-youtube icon"></i> YouTube Channel
            </a>
            <a href="https://discord.com/invite/mYDASnjxJN" target="_blank" rel="noopener">
                <i class="fab fa-discord icon"></i> Discord Server
            </a>
        </div>
    </div>

    <div class="comments-section">
        <textarea class="comment-box" rows="4" placeholder="Write your comment here..." aria-label="Comment"></textarea>
        <button class="comment-btn" onclick="addComment()">Submit Comment</button>
        <div class="comment-list" id="commentList" aria-live="polite">
            <!-- Comments will appear here -->
        </div>
    </div>

    <div class="image-section">
        <img src="https://via.placeholder.com/300" alt="Downloadable Image" id="imageToDownload">
        <br>
        <a href="https://via.placeholder.com/300" download="DarkopLOL101_image">
            <button class="download-btn">Download Image</button>
        </a>
    </div>

    <div class="fun-animation">welcome</div>

    <script>
        function copyText() {
            const text = "DarkopLOL101.aternos.me:38609";
            navigator.clipboard.writeText(text).then(() => {
                alert("Server address copied to clipboard!");
            });
        }

        function addComment() {
            const commentBox = document.querySelector('.comment-box');
            const commentText = commentBox.value.trim();

            if (!commentText) {
                alert("Please enter a comment.");
                return;
            }

            const commentList = document.getElementById('commentList');
            const newComment = document.createElement('div');
            newComment.classList.add('comment');
            newComment.textContent = commentText;

            commentList.appendChild(newComment);
            commentBox.value = ""; // Clear the comment box
        }
    </script>

</body>
</html>
